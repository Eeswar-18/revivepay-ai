# =============================================================================
# RevivePay AI — Agent-visible economics configuration
# =============================================================================
#
# WHAT THIS FILE IS
# -----------------
# Observable business parameters that any layer of the decision pipeline —
# feature builders, the EV calculator, the policy kernel — is permitted to
# read.  These are facts a real merchant already knows from its own payment
# processor statements, support costs, and CRM data.
#
# WHAT THIS FILE IS NOT
# ---------------------
# This file does NOT contain ground-truth probabilities, hidden multipliers,
# or any parameter from backend/app/sim/world_config.yaml that the agent is
# not supposed to see.  The decision/agent boundary is enforced by the AST
# architecture test in backend/tests/test_architecture.py.
#
# DELIBERATE DIVERGENCE — READ THIS BEFORE EDITING
# -------------------------------------------------
# estimated_churn_hazard_by_contact_index intentionally differs from the true
# values in world_config.yaml.  This is NOT a transcription error.
#
# True world values:   {1: 0.0015, 2: 0.0042, 3: 0.0110, 4: 0.0265,
#                       5: 0.0540, default_beyond: 0.0950}
# Agent estimates:     {1: 0.0020, 2: 0.0050, 3: 0.0100, 4: 0.0210,
#                       5: 0.0400, default_beyond: 0.0650}
#
# The agent is slightly pessimistic on the first two contacts and materially
# optimistic from the fourth onward.  This models the realistic situation that
# no merchant knows its true churn response function.  The evaluation can then
# measure how much value is destroyed by mis-specified annoyance estimates —
# a meaningful sensitivity analysis that would be impossible if agent and
# world used identical parameters.
#
# Do NOT "correct" these numbers to match world_config.yaml.
# =============================================================================

# ---------------------------------------------------------------------------
# Merchant discount rate (basis points).  Observable from processor statements.
# ---------------------------------------------------------------------------
mdr_bps: 200                           # 2.00 %

# ---------------------------------------------------------------------------
# Intervention direct costs (integer paise) and customer-contact flag.
# Mirrors world_config.yaml section 2 — these are observable cost-of-goods.
# ---------------------------------------------------------------------------
interventions:

  STOP:
    cost_minor: 0
    contacts_customer: false

  RETRY_SAME_RAIL:
    cost_minor: 300                    # ~Rs 3 gateway attempt fee
    contacts_customer: false

  RETRY_ALTERNATE_RAIL:
    cost_minor: 450                    # ~Rs 4.50 alternate rail
    contacts_customer: false

  EMAIL_NUDGE:
    cost_minor: 2                      # ~Rs 0.02
    contacts_customer: true

  SMS_NUDGE:
    cost_minor: 20                     # ~Rs 0.20
    contacts_customer: true

  WHATSAPP_NUDGE:
    cost_minor: 12                     # ~Rs 0.12 utility template
    contacts_customer: true

  REQUEST_NEW_INSTRUMENT:
    cost_minor: 20
    contacts_customer: true

  AGENT_CALL:
    cost_minor: 3500                   # ~Rs 35 human support time
    contacts_customer: true

# ---------------------------------------------------------------------------
# Customer segments — lifetime value and churn sensitivity.
# Mirrors world_config.yaml section 6 — a merchant estimates these from its
# own cohort analysis and CRM churn models.
# ---------------------------------------------------------------------------
customer_segments:

  NEW:
    lifetime_value_minor: 180000       # Rs 1,800
    churn_sensitivity: 1.45

  OCCASIONAL:
    lifetime_value_minor: 650000       # Rs 6,500
    churn_sensitivity: 1.00

  LOYAL:
    lifetime_value_minor: 2400000      # Rs 24,000
    churn_sensitivity: 0.70

  HIGH_VALUE:
    lifetime_value_minor: 9500000      # Rs 95,000
    churn_sensitivity: 0.55

# ---------------------------------------------------------------------------
# Estimated churn hazard per contact index.
#
# DELIBERATELY MIS-SPECIFIED — see header comment.  Do NOT align with world.
# ---------------------------------------------------------------------------
estimated_churn_hazard_by_contact_index:
  1: 0.0020
  2: 0.0050
  3: 0.0100
  4: 0.0210
  5: 0.0400
  default_beyond: 0.0650
