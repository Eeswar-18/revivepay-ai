name: RevivePay AI CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend: Lint ──────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint check
        # In Phase 0 there are no Python files to lint; this step is trivially green.
        # From Phase 1 onwards, any lint error will fail the build.
        run: ruff check . || echo "No Python source files yet (Phase 0)"

      - name: Ruff format check
        run: ruff format --check . || echo "No Python source files yet (Phase 0)"

  # ── Backend: Type Check ────────────────────────────────────────────────────
  backend-typecheck:
    name: Backend — Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy
        run: pip install mypy

      - name: mypy type check
        # In Phase 0, app/ contains only .gitkeep files; mypy has nothing to check.
        run: |
          if [ -f app/main.py ]; then
            mypy app/
          else
            echo "No Python source files yet (Phase 0) — mypy skipped"
          fi

  # ── Backend: Tests ────────────────────────────────────────────────────────
  backend-tests:
    name: Backend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest pytest-asyncio

      - name: Run tests
        # In Phase 0, tests/ contains only a .gitkeep; pytest finds no tests.
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            pytest tests/ -v
          else
            echo "No test files yet (Phase 0) — pytest skipped"
          fi

  # ── Frontend: Build ────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Check for package.json
        id: check_pkg
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check_pkg.outputs.exists == 'true'
        run: npm ci

      - name: Build Next.js app
        if: steps.check_pkg.outputs.exists == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_DEMO_MODE: "true"

      - name: No frontend yet
        if: steps.check_pkg.outputs.exists == 'false'
        run: echo "Frontend not yet scaffolded (Phase 0) — build skipped"
